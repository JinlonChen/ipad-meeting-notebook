name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install relay dependencies
        run: pip install -r services/transcription-relay/requirements-dev.txt

      - name: Typecheck
        run: npm run typecheck

      - name: Run full test suite
        run: npm test

      - name: Test transcription relay
        run: PYTHONPATH=services/transcription-relay pytest -q services/transcription-relay/tests

      - name: Validate Supabase schema contract
        run: node --test test/supabase-schema.test.mjs

      - name: Build production workspaces
        run: npm run build

      - name: Check browser bundle for private configuration
        run: npm run scan:web-dist

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance tests
        run: npm run test:e2e
