services:
  - type: web
    name: ipad-meeting-transcription
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./services/transcription-relay/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
